name: soc-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_app_password}
      POSTGRES_DB: ${POSTGRES_DB:-soc_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc_app}:${POSTGRES_PASSWORD:-soc_app_password}@postgres:5432/${POSTGRES_DB:-soc_dashboard}
    volumes:
      - ../backend/app:/app/app
      - ../backend/migrations:/app/migrations
      - ../backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc_app}:${POSTGRES_PASSWORD:-soc_app_password}@postgres:5432/${POSTGRES_DB:-soc_dashboard}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WAZUH_MODE: ${WAZUH_MODE:-mock}
      WAZUH_API_URL: ${WAZUH_API_URL:-https://localhost:55000}
      WAZUH_API_USER: ${WAZUH_API_USER:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-change_me}
      WAZUH_VERIFY_SSL: ${WAZUH_VERIFY_SSL:-false}
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/migrations:/app/migrations
      - ../backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
